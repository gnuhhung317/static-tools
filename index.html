<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Static HTML Tools — Links Extractor</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <main class="container">
    <h1>Static HTML Tools</h1>
    <p class="lead">Paste raw HTML, pick a module and run. Built as ES modules so you can add/copy modules into <code>js/modules/</code>.</p>

    <div class="form-row">
      <label for="moduleSelect">Module</label>
      <select id="moduleSelect"></select>
    </div>

    <div class="form-row">
      <label for="baseUrl">Optional base URL (resolve relative links)</label>
      <input id="baseUrl" type="text" placeholder="https://example.com/" />
    </div>

    <div class="form-row">
      <label>
        <input type="checkbox" id="removeFragments" />
        Remove duplicate URLs by ignoring fragments (e.g., #:~:text=...)
      </label>
    </div>

    <div class="form-row">
      <label for="rawHtml">Raw HTML</label>
      <textarea id="rawHtml" placeholder="Paste HTML here..."></textarea>
    </div>

    <div class="form-row controls">
      <button id="runBtn">Run</button>
      <button id="clearBtn" class="muted">Clear</button>
      <button id="copyBtn" class="muted" disabled>Copy</button>
    </div>

    <section id="resultArea" class="result">
      <h2>Result</h2>
      <div id="resultMeta"></div>
      <pre id="resultPre" class="result-pre"></pre>
    </section>

    <footer>
      <small>Designed for GitHub Pages — add more modules under <code>js/modules/</code>.</small>
    </footer>
  </main>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
